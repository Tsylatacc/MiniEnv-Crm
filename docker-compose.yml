services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__db: "${MINIENV_DB_CONNECTION}"
      ConnectionStrings__rabbitmq: "${MINIENV_RABBITMQ_CONNECTION}"
      ConnectionStrings__redis: "${MINIENV_REDIS_CONNECTION}"

      Jwt__Bearer__Key: "${JWT_BEARER_KEY}"
      Jwt__Bearer__ExpiresInMinutes: "${JWT_BEARER_EXPIRES_IN_MINUTES}"
      Jwt__Bearer__Issuer: "${JWT_BEARER_ISSUER}"
      Jwt__Bearer__Audience: "${JWT_BEARER_AUDIENCE}"

      Jwt__SignUp__Key: "${JWT_SIGNUP_KEY}"
      Jwt__SignUp__ExpiresInMinutes: "${JWT_SIGNUP_EXPIRES_IN_MINUTES}"
      Jwt__SignUp__Issuer: "${JWT_SIGNUP_ISSUER}"
      Jwt__SignUp__Audience: "${JWT_SIGNUP_AUDIENCE}"

      Jwt__Refresh__ExpiresInDays: "${JWT_REFRESH_EXPIRES_IN_DAYS}"

  workers:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development

      ConnectionStrings__db: "${MINIENV_DB_CONNECTION}"
      ConnectionStrings__rabbitmq: "${MINIENV_RABBITMQ_CONNECTION}"
      ConnectionStrings__redis: "${MINIENV_REDIS_CONNECTION}"

      FrontEnd__ActiveUrl: "${FRONTEND_ACTIVEURL}"

      EmailSettings__User: "${EMAILSETTINGS_USER}"
      EmailSettings__Port: "${EMAILSETTINGS_PORT}"
      EmailSettings__Password: "${EMAILSETTINGS_PASSWORD}"
      EmailSettings__Host: "${EMAILSETTINGS_HOST}"
      EmailSettings__FromName: "${EMAILSETTINGS_FROMNAME}"

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: minienv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minienv"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10